<meta name="robots" content="noindex,nofollow">
<title>Unlock Theater</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Bungee&family=Nunito:wght@600;800&family=JetBrains+Mono:wght@600&display=swap">
<style>
/* Layout: a dark theater. Video on top; when the minute is up, a locked door slides over it with one question. */
:root{--bg:#120a1f;--panel:#1d1230;--ink:#f6eeff;--muted:#bba8d8;--line:#3b2a5a;--orange:#ff8a1f;--purple:#b07cff;--good:#7cff6b;--bad:#ff4d6d;--gold:#ffc23d;
 --spook:"Creepster","Bungee",Impact,sans-serif;--disp:"Bungee",Impact,sans-serif;--body:"Nunito",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a1a5c 0,transparent 60%),var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;min-height:100vh;
 padding:12px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--spook);font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;color:var(--orange);letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:14px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 10px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.btn{font:inherit;font-weight:800;font-size:17px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.go{background:var(--orange);border-color:var(--orange);color:#1a0b00}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea,input[type=number]{font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px;width:100%}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 12px;font-size:16px}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
#yt{position:absolute;inset:0;width:100%;height:100%}
.lock{position:absolute;inset:0;background:linear-gradient(90deg,#2a1608 0 49.6%,#120a1f 49.6% 50.4%,#2a1608 50.4%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;overflow:auto;transition:transform .5s}
.lock[hidden]{display:none}
.lock .door{font-size:44px}
.q{font-size:clamp(17px,3vw,24px);font-weight:800;max-width:720px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;width:100%;max-width:720px}
.opt{font:inherit;font-weight:800;font-size:16px;padding:10px;border-radius:12px;border:2px solid var(--purple);background:var(--panel);color:var(--ink);cursor:pointer;text-align:left}
.opt b{font-family:var(--disp);color:var(--gold);margin-right:6px}
.msg{font-weight:800;max-width:720px}.msg.g{color:var(--good)}.msg.b{color:var(--bad)}
.why{font-size:15px;color:var(--muted);max-width:720px}
.ty{font:inherit;font-size:17px;padding:8px;border-radius:10px;border:2px solid var(--gold);background:var(--bg);color:var(--ink);width:min(520px,100%)}
.vids{display:flex;gap:8px;flex-wrap:wrap}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange);transition:width .4s}
.muted{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

const MOTTO={m1:"Each place is ten times the place to its right",m2:"Add zeros then compare from the left",m3:"Look right and five or more rounds up",m4:"Line up the points",m5:"Each new row starts with a zero",m6:"Count the zeros and move the point",m7:"Multiply then count places in both numbers",m8:"Fill zeros in front",
 g1:"A command tells someone to do something",g2:"The subject of a command is you",g3:"Find the verb first",g4:"A compound sentence needs two sentences",g5:"A clause has a subject and a verb",g6:"FANBOYS make compound and because makes complex",g7:"Count the independent clauses then look for a dependent one",g8:"A comma alone cannot join two sentences",g9:"Comma before FANBOYS and after a first dependent clause"};


// ---------- unlock theater ----------
const SKILLS={m7:"Multiply decimals",m8:"Zero traps",m5:"Long multiplication",m6:"Powers of 10",m4:"Add & subtract decimals",m3:"Rounding",m2:"Compare decimals",m1:"Place value",
 g7:"Simple / compound / complex / compound-complex",g6:"Joining words (FANBOYS vs because)",g8:"Fragments, run-ons, comma splices",g9:"Commas",g5:"Clauses vs phrases",g4:"Compound parts",g3:"Subject & predicate",g2:"Hidden You",g1:"Sentence types"};
const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg=LS("ut-cfg")||{vids:"",secs:75,skills:Object.keys(SKILLS),start:5};
let stats=LS("ut-stats")||{};let seen=new Set(LS("ut-seen")||[]);
let player=null,ready=false,locked=false,nextLock=0,keys=0,streak=0,lvl=cfg.start,unlocks=0,poll=null,curVid=null;
const app=document.getElementById("app");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
function vidId(u){const m=String(u).match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u.trim())?u.trim():null)}
function makeQ(k,L){for(let t=0;t<60;t++){const q=(L>=4&&HW[k]&&Math.random()<.3)?HW[k]():(L>=5?H5[k]():(Q[k]||G[k])(L));q.o=shuffle(q.o.slice());q.k=k;const key=k+"|"+q.q+"|"+q.o.slice().sort().join("/");if(!seen.has(key)){seen.add(key);SV("ut-seen",[...seen].slice(-5000));return q}}return L>1?makeQ(k,L-1):(seen=new Set(),makeQ(k,5))}
function rec(k,ok){const s=stats[k]||(stats[k]={n:0,ok:0});s.n++;if(ok)s.ok++;SV("ut-stats",stats)}

function setup(){
  app.innerHTML=`<div class="top"><h1>Unlock Theater</h1><span class="chip">🔒 the video stops every minute. Solve to unlock.</span></div>
  <div class="panel"><b>Coach setup</b>
   <label class="muted" for="v">YouTube links (one per line, approved by a parent)</label><textarea id="v" rows="5" placeholder="https://www.youtube.com/watch?v=...">${esc(cfg.vids)}</textarea>
   <div class="row"><label class="muted" for="s" style="align-self:center">Seconds of video per unlock</label><input type="number" id="s" min="20" max="300" value="${cfg.secs}" style="width:110px">
   <label class="muted" for="lv" style="align-self:center">Start level (5 = hardest)</label><input type="number" id="lv" min="1" max="5" value="${cfg.start}" style="width:80px"></div>
   <div class="muted">Skills in the mix</div><div class="skills">${Object.entries(SKILLS).map(([k,n])=>`<label><input type="checkbox" value="${k}" ${cfg.skills.includes(k)?"checked":""}> ${n}</label>`).join("")}</div>
   <div class="row"><button class="btn go" id="go">Start the show</button><button class="btn" id="rep">Report</button></div></div>`;
  document.getElementById("go").onclick=()=>{cfg={vids:document.getElementById("v").value,secs:Math.max(20,+document.getElementById("s").value||75),start:Math.min(5,Math.max(1,+document.getElementById("lv").value||5)),skills:[...app.querySelectorAll(".skills input:checked")].map(x=>x.value)};
    if(!cfg.skills.length)cfg.skills=["m7"];SV("ut-cfg",cfg);lvl=cfg.start;theater()};
  document.getElementById("rep").onclick=report;
}
function theater(){
  const ids=cfg.vids.split(/\s+/).map(vidId).filter(Boolean);
  app.innerHTML=`<div class="top"><h1>Unlock Theater</h1><div class="chips"><span class="chip" id="ck">🗝️ ${keys}</span><span class="chip" id="sk">🔥 ${streak}</span><span class="chip" id="un">🔓 ${unlocks}</span><span class="chip" id="lvc">Level ${lvl}</span><button class="btn" id="back" style="font-size:14px;padding:6px 10px">Setup</button></div></div>
  <div class="vids">${ids.map((id,j)=>`<button class="btn" data-v="${id}">🎬 Video ${j+1}</button>`).join("")||'<span class="muted">Add YouTube links in Setup.</span>'}</div>
  <div class="stage"><div id="yt"></div><div class="lock" id="lk" hidden></div></div>
  <div class="bar"><i id="pb" style="width:0%"></i></div>
  <div class="row"><button class="btn go" id="pp">▶ Play</button><button class="btn" id="usekey">Use a 🗝️ golden key</button></div>
  <p class="muted" style="margin:0">Every ${cfg.secs} seconds the door locks. Answer right to unlock the next part. 3 right in a row earns a golden key that skips one lock.</p>`;
  document.getElementById("back").onclick=()=>{stopAll();setup()};
  app.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>load(b.dataset.v));
  document.getElementById("pp").onclick=()=>{if(!player||locked)return;const s=player.getPlayerState();s===1?player.pauseVideo():player.playVideo()};
  document.getElementById("usekey").onclick=()=>{if(locked&&keys>0){keys--;chips();unlock("🗝️ Golden key used!")}};
  if(ids.length)load(ids[0]);
}
function chips(){const s=(id,t)=>{const e=document.getElementById(id);if(e)e.textContent=t};s("ck","🗝️ "+keys);s("sk","🔥 "+streak);s("un","🔓 "+unlocks);s("lvc","Level "+lvl)}
function stopAll(){clearInterval(poll);poll=null;try{player&&player.destroy()}catch(e){}player=null}
function load(id){stopAll();curVid=id;locked=false;nextLock=cfg.secs;document.getElementById("lk").hidden=true;
  const mk=()=>{player=new YT.Player("yt",{videoId:id,playerVars:{controls:0,disablekb:1,modestbranding:1,rel:0,fs:0,playsinline:1},
    events:{onStateChange:e=>{if(locked&&e.data===1)player.pauseVideo();const pp=document.getElementById("pp");if(pp)pp.textContent=e.data===1?"⏸ Pause":"▶ Play"}}});
    poll=setInterval(tick,400)};
  if(window.YT&&YT.Player)mk();else window.onYouTubeIframeAPIReady=mk;
}
function tick(){if(!player||!player.getCurrentTime)return;const t=player.getCurrentTime(),d=player.getDuration()||1;
  const pb=document.getElementById("pb");if(pb)pb.style.width=Math.min(100,100*t/d)+"%";
  if(!locked&&t>=nextLock&&t<d-3){lockNow()}}
function lockNow(){locked=true;player.pauseVideo();ask(false)}
function ask(retry){const lk=document.getElementById("lk");lk.hidden=false;
  const k=pick(cfg.skills);const q=makeQ(k,lvl);
  lk.innerHTML=`<div class="door">🚪🔒</div><div class="muted" style="font-family:var(--disp);font-size:13px">${retry?"ONE MORE TO UNLOCK":"KEEP THE DOOR LOCKED... UNLESS YOU SOLVE IT"} · ${esc(SKILLS[k])} · level ${lvl}</div>
   <div class="q">${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-o="${j}"><b>${"ABCD"[j]}</b>${esc(o)}</button>`).join("")}</div><div class="msg" id="m"></div>`;
  lk.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const ok=q.o[+b.dataset.o]===q.a;rec(k,ok);
    lk.querySelectorAll("[data-o]").forEach(x=>x.disabled=true);
    if(ok){streak++;if(streak%3===0){keys++}if(streak>=2&&lvl<5)lvl++;chips();
      if(unlocks%3===2)return explain(q,k);unlock(streak%3===0?"🔓 Unlocked! +1 🗝️ golden key":"🔓 Unlocked!")}
    else{streak=0;if(lvl>1)lvl--;chips();const m=document.getElementById("m");m.className="msg b";
      m.innerHTML=`Not that one. Answer: ${esc(q.a)}<div class="why">${esc(q.why)}</div><div class="why">Type the rule to try again:</div><div style="color:var(--gold);font-family:var(--mono)">${esc(MOTTO[k])}</div><input class="ty" id="ty" autocomplete="off" aria-label="Type the rule"> <button class="btn go" id="tyok">Done</button>`;
      const ty=document.getElementById("ty"),nz=x=>x.toLowerCase().replace(/[^a-z0-9]/g,"");ty.focus();
      const go=()=>{if(nz(ty.value)===nz(MOTTO[k]))ask(true);else ty.style.borderColor="var(--bad)"};document.getElementById("tyok").onclick=go;ty.onkeydown=e=>{if(e.key==="Enter")go()}}})}
function explain(q,k){const lk=document.getElementById("lk");const others=shuffle(Object.keys(MOTTO).filter(x=>x!==k)).slice(0,2);const ch=shuffle([k,...others]);
  lk.innerHTML=`<div class="door">🧠</div><div class="q">Right! Now prove it: which rule did you use?</div><div class="muted">${esc(q.q)} → ${esc(q.a)}</div>
   <div class="opts">${ch.map(x=>`<button class="opt" data-r="${x}">${esc(MOTTO[x])}</button>`).join("")}</div><div class="msg" id="m"></div>`;
  lk.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(b.dataset.r===k)unlock("🔓 Unlocked! You know WHY.");else{b.disabled=true;const m=document.getElementById("m");m.className="msg b";m.textContent="Not that rule. Look at the question again."}})}
function unlock(text){const lk=document.getElementById("lk");unlocks++;chips();lk.innerHTML=`<div class="door">🔓</div><div class="q" style="color:var(--good)">${esc(text)}</div>`;
  setTimeout(()=>{lk.hidden=true;locked=false;nextLock=player.getCurrentTime()+cfg.secs;player.playVideo()},900)}
function report(){const rows=Object.entries(stats);const txt="Unlock Theater report ("+new Date().toLocaleDateString()+")\n"+rows.map(([k,s])=>`- ${SKILLS[k]}: ${s.ok}/${s.n} right (${Math.round(100*s.ok/s.n)}%)`).join("\n");
  app.innerHTML=`<div class="top"><h1>Report</h1><button class="btn" id="b">Back</button></div><div class="panel"><table><tr><th>Skill</th><th>Right</th><th>%</th></tr>${rows.map(([k,s])=>`<tr><td>${SKILLS[k]}</td><td>${s.ok}/${s.n}</td><td>${Math.round(100*s.ok/s.n)}%</td></tr>`).join("")||'<tr><td colspan="3" class="muted">No answers yet.</td></tr>'}</table>
  <textarea rows="6" readonly>${esc(txt)}</textarea><div class="row"><button class="btn" id="cp">Copy</button><button class="btn" id="clr">Clear stats</button></div></div>`;
  document.getElementById("b").onclick=setup;document.getElementById("cp").onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(txt);
  let armed=false;document.getElementById("clr").onclick=e=>{if(!armed){armed=true;e.target.textContent="Tap again to clear";return}stats={};SV("ut-stats",stats);report()}}
setup();
</script></body></html>
